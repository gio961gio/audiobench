[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobench"
version = "0.1.0"
description = "Professional offline audio render regression benchmark and DSP metrological verification suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "Giovanni Antonecchia", email = "gio.antonecchia961@gmail.com" }
]
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "soundfile>=0.12.0",
]

[project.optional-dependencies]
plugins = [
  "pedalboard>=0.9.0",
]
ui = [
  "streamlit>=1.30.0",
]
dev = [
  "pytest>=7.4.0",
  "pedalboard>=0.9.0",
  "streamlit>=1.30.0",
]

[project.scripts]
audiobench = "audiobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
