[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobench"
version = "0.1.0"
description = "A lightweight offline regression test bench for audio renders and DSP algorithms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AudioBench contributors" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
]

[project.optional-dependencies]
plugins = [
  "pedalboard>=0.9.0",
]
ui = [
  "streamlit>=1.30.0",
]
dev = [
  "pytest>=7.4",
  "pedalboard>=0.9.0",
  "streamlit>=1.30.0",
]

[project.scripts]
audiobench = "audiobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
